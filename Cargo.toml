[package]
name = "quaestor-pub-lib-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Public, transport-neutral Quaestor client primitives for untrusted devices"
repository = "https://github.com/quaestor-ledger/quaestor-pub-lib-core"
keywords = ["ledger", "client", "contracts", "idempotency"]
categories = ["data-structures"]
include = ["/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md", "/conformance/public-core-v1.json", "/src/lib.rs"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.145"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
